# --- General ---
set -g mouse on
set -g history-limit 50000
set -g escape-time 10            # avoids laggy Esc in vim/neovim
set -g repeat-time 600
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on

# --- Open new pane/window in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Start numbering at 0
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# --- Reload config ---
bind r source-file ~/dotfiles/tmux/tmux.conf \; display "Reloaded"

# --- Pane navigation: prefix + h/j/k/l ---
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# --- Pane resizing: prefix + H/J/K/L ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Restore "last window", since prefix + l is now taken
bind Tab last-window

# --- Copy mode / clipboard (pbcopy) ---
set -g set-clipboard on
set -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Mouse drag copies to the system clipboard on release
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
